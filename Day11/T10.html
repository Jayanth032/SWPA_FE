<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Border Style Box</title>
  <style>
    .fancy-border-box {
      width: 300px;
      height: 150px;
      padding: 20px;
      background-color: #f0f8ff; /* AliceBlue */
      font-family: Arial, sans-serif;

      border-top: 3px solid #000;
      border-left: 3px dashed #ff4500;
      border-right: 3px dotted #1e90ff;
      border-bottom: 5px double #228b22;
    }
  </style>
</head>
<body>

  <div class="fancy-border-box">
    Box with different border styles on each side.
  </div>

</body>
</html>
