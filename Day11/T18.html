<style>
  .raised-button {
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .raised-button:active {
    box-shadow: 0 2px 2px rgba(0,0,0,0.3);
    transform: translateY(2px);
  }
</style>

<button class="raised-button">Raised Button</button>
