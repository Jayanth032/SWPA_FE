<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paragraph Padding</title>
  <style>
    .colored-box {
      width: 400px;
      background-color:lightgreen; /* Light green */
      border: 2px solid #333;
      font-family: Arial, sans-serif;
    }

    .colored-box p {
      padding: 20px;
      background-color: white; 
    }
  </style>
</head>
<body>

  <div class="colored-box">
    <p> Hello Everyone</p>
  </div>

</body>
</html>
