<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Box</title>
  <style>
    .parent {
      width: 100%;
      background-color: #f0f0f0;
      padding: 20px;
    }

    .child {
      width: 50%;
      height: 150px;
      background-color: #4CAF50;
      color: white;
      text-align: center;
      line-height: 150px;
    }
  </style>
</head>
<body>

  <div class="parent">
    <div class="child">50% Width of Parent</div>
  </div>

</body>
</html>
