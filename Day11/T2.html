<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Side-by-Side Boxes</title>
  <style>
    .box1 {
      display: inline-block;
      width: 200px;
      height: 150px;
      background-color: lightcoral;
      margin-right: 10px;
    }

    .box2 {
      display: inline-block;
      width: 300px;
      height: 150px;
      background-color: lightseagreen;
    }
  </style>
</head>
<body>

  <div class="box1">Box 1 (200px)</div>
  <div class="box2">Box 2 (300px)</div>

</body>
</html>
