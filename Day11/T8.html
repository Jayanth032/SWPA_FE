<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solid Border Box</title>
  <style>
    .border-box {
      width: 300px;
      height: 150px;
      background-color: #f5f5dc; /* Beige */
      border: 2px solid black;
      font-family: Arial, sans-serif;
      text-align: center;
      line-height: 150px;
    }
  </style>
</head>
<body>

  <div class="border-box">
    2px Solid Black Border
  </div>

</body>
</html>
