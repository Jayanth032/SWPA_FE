<style>
  .marvel-hero {
    height: 450px;
    background-image: url('https://www.pngall.com/wp-content/uploads/13/Marvel-Logo-PNG-Image.png'); 
    background-size: cover;
    background-position: center;
    position: relative;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Arial', sans-serif;
  }

  .marvel-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5); 
  }

  .marvel-hero h1 {
    position: relative;
    font-size: 3rem;
    font-weight: bold;
    text-shadow: 2px 2px 8px red;
    z-index: 1;
  }
</style>

<div class="marvel-hero">
  <h1>Marvel</h1>
</div>
