<style>
  .box {
    width: 200px;
    padding: 20px;
    border: 5px solid #000;
    margin-bottom: 20px;
    background-color: #f0e68c;
  }

  .content-box {
    box-sizing: content-box; /* Default */
  }

  .border-box {
    box-sizing: border-box;
  }
</style>

<div class="box content-box">Content-box (default)</div>
<div class="box border-box">Border-box</div>
