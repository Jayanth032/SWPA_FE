<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dotted Red Warning Box</title>
  <style>
    .warning-box {
      width: 350px;
      padding: 15px;
      background-color: #ffe6e6; /* Light red background */
      border: 2px dotted red;
      color: #cc0000; /* Dark red text */
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="warning-box">
     Warning: This action is not reversible. Proceed with caution!
  </div>

</body>
</html>
