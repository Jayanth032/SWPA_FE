<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Padding Demo</title>
  <style>
    .padded-box {
      width: 300px;
      background-color: #add8e6;
      border: 2px solid #000;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="padded-box">
    This content has <strong>20px padding</strong> around it.
  </div>

</body>
</html>
