<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic To-Do List</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #1e1e1e;
      color: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    #todo-form {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    #todo-form input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    #todo-form button {
      padding: 10px;
      font-size: 16px;
      margin-left: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 500px;
      margin: auto;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }
    li.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }
    .btn {
      margin-left: 5px;
      cursor: pointer;
    }
    .count {
      text-align: center;
      margin: 10px 0;
    }
    .dark-toggle {
      display: block;
      margin: auto;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      #todo-form {
        flex-direction: column;
        align-items: center;
      }
      #todo-form input {
        width: 90%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <h1>📝 To-Do List</h1>
  <button class="dark-toggle">🌙 Toggle Dark Mode</button>

  <form id="todo-form">
    <input type="text" id="todo-input" placeholder="Enter a task..." required>
    <button type="submit">Add</button>
  </form>

  <div class="count">Tasks Remaining: <span id="task-count">0</span></div>

  <ul id="todo-list"></ul>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('task-count');
    const toggleBtn = document.querySelector('.dark-toggle');

    let tasks = [];

    function updateCount() {
      const remaining = tasks.filter(task => !task.completed).length;
      count.textContent = remaining;
    }

    function renderTasks() {
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = task.completed ? 'completed' : '';
        li.innerHTML = `
          <span>${task.text}</span>
          <div>
            <button class="btn" onclick="toggleComplete(${index})">✅</button>
            <button class="btn" onclick="editTask(${index})">✏️</button>
            <button class="btn" onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        list.appendChild(li);
      });
      updateCount();
    }

    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      renderTasks();
    }

    function editTask(index) {
      const newText = prompt("Edit task:", tasks[index].text);
      if (newText !== null && newText.trim() !== '') {
        tasks[index].text = newText.trim();
        renderTasks();
      }
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) {
        tasks.push({ text, completed: false });
        input.value = '';
        renderTasks();
      }
    });

    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>

</body>
</html>
