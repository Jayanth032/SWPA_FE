<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Spacing</title>
  <style>
    .card {
      background: white;
      padding: 2rem;
      margin: 5%;
      border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      font-family: sans-serif;
    }
  </style>
</head>
<body style="background: #f9f9f9;">

  <div class="card">
    <h3>Card Layout</h3>
    <p>This card has <code>padding: 2rem</code> and <code>margin: 5%</code>.</p>
  </div>

</body>
</html>
