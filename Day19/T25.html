<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Theme Override</title>
  <style>
    :root {
      --primary-color: #333;
    }

    body {
      color: var(--primary-color);
      padding: 2rem;
    }

    .dark-theme {
      --primary-color: #fff;
      background-color: #222;
      color: var(--primary-color);
    }
  </style>
</head>
<body class="dark-theme">

  <p>This is a dark theme override using CSS variable.</p>

</body>
</html>
