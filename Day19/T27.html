<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc with CSS Variable</title>
  <style>
    :root {
      --gap: 2rem;
    }

    .box {
      width: calc(100% - var(--gap));
      background-color: #fdd835;
      padding: 1rem;
      margin: 1rem auto;
    }
  </style>
</head>
<body>

  <div class="box">This box uses <code>calc(100% - var(--gap))</code></div>

</body>
</html>
