<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Font Size Mobile</title>
  <style>
    body {
      font-size: 20px;
      padding: 2rem;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <p>This text has a larger font on desktop, and smaller font on mobile.</p>

</body>
</html>
