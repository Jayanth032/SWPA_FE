<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Centered Section</title>
  <style>
    .flex-center {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffe0b2;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="flex-center">
    <div>
      <h2>Centered Content</h2>
      <p>This section uses <code>min-height: 100vh</code> and flex to center content.</p>
    </div>
  </div>

</body>
</html>
