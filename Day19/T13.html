<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hide Image</title>
  <style>
    img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      img {
        display: none;
      }
    }
  </style>
</head>
<body>

  <h2>Responsive Image Visibility</h2>
  <img src="https://www.bing.com/th?id=OAIP.58e95b954fb0f1946b962a07343b8838&pid=AdsNative&c=17&roil=0&roit=0&roir=1&roib=0.7672&w=300&h=157&dynsize=1&qlt=90&dpr=2.00" alt="Placeholder Image">

</body>
</html>
