<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <style>
    :root {
      --container-width: 90%;
      --side-padding: 2rem;
    }

    .container {
      width: var(--container-width);
      padding: 0 var(--side-padding);
      margin: auto;
      background-color: #e0f7fa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <p>This layout uses container width and side padding with variables.</p>
  </div>

</body>
</html>
