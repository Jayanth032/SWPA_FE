<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Centering</title>
  <style>
    .wrapper {
      max-width: 1200px;  /* Task 10 */
      margin: auto;
      padding: 1rem;
      background-color: #f8f8f8;
    }

    .inner-container {
      width: 90%;        /* Task 2 */
      margin: 0 auto;
      background: #dff0d8;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="inner-container">
      <p>This container is 90% wide and centered using <code>margin: auto</code>.</p>
    </div>
  </div>

</body>
</html>
