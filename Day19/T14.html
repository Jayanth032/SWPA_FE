<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Navbar</title>
  <style>
    .navbar {
      display: flex;
      background: #333;
      padding: 1rem;
    }

    .navbar a {
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
      }

      .navbar a {
        padding: 0.75rem;
        border-bottom: 1px solid #444;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </div>

</body>
</html>
