<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image</title>
  <style>
    .responsive-img {
      width: 80%;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 2px solid #ccc;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">Responsive Image Example</h2>
  <img class="responsive-img" src="https://th.bing.com/th?id=ORMS.b19a28a08d5ecafeb2b8f0acdba6dfe3&pid=Wdp&w=268&h=140&qlt=90&c=1&rs=1&dpr=1&p=0" alt="Responsive Example">

</body>
</html>
