<!DOCTYPE html>
<html>
<head>
  <title>Magazine Layout</title>
  <style>
    .magazine {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: auto;
      gap: 10px;
      position: relative;
    }

    .text {
      background: #F06292;
      padding: 20px;
      z-index: 1;
    }

    .image {
      background: url('https://via.placeholder.com/300') center/cover no-repeat;
      height: 200px;
      z-index: 2;
      grid-column: 1 / 3;
      grid-row: 1;
      opacity: 0.8;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="magazine">
    <div class="image"></div>
    <div class="text">Featured Article Content Over Image</div>
  </div>
</body>
</html>
