<!DOCTYPE html>
<html>
<head>
  <title>Grid + Flexbox Cards</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #eee;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .card-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="card">
      <h3>Card 1</h3>
      <div class="card-footer">
        <span>Like</span><span>Share</span>
      </div>
    </div>
    <div class="card">
      <h3>Card 2</h3>
      <div class="card-footer">
        <span>Like</span><span>Share</span>
      </div>
    </div>
  </div>
</body>
</html>
