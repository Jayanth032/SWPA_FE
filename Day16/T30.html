<!DOCTYPE html>
<html>
<head>
  <title>Calendar Grid</title>
  <style>
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 100px);
      gap: 5px;
      padding: 20px;
    }

    .day {
      background: #90CAF9;
      text-align: center;
      padding-top: 10px;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="calendar">
    <!-- You can use a loop or manually enter day numbers -->
    <div class="day">1</div>
    <div class="day">2</div>
    <div class="day">3</div>
    <div class="day">4</div>
    <div class="day">5</div>
    <div class="day">6</div>
    <div class="day">7</div>
    <!-- Add more as needed -->
  </div>
</body>
</html>
