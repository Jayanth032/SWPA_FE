<!DOCTYPE html>
<html>
<head>
  <title>Responsive Grid – auto-fit</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .grid-item {
      background: #4CAF50;
      color: white;
      padding: 30px;
      text-align: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
  </div>
</body>
</html>
