<!DOCTYPE html>
<html>
<head>
  <title>TechFest 2025</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: url('https://source.unsplash.com/1600x900/?technology,event') no-repeat center center/cover;
      color: #fff;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      min-height: 100vh;
      padding: 30px;
    }

    .welcome-box {
      background: #ffffffcc;
      color: #000;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: 20px auto;
      border: 2px solid #3498db;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    table {
      margin: 30px auto;
      background: #ffffffcc;
      color: #000;
      border-collapse: collapse;
      width: 80%;
    }

    th, td {
      border: 1px solid #3498db;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #2980b9;
      color: white;
    }

    /* Gallery */
    .gallery {
      margin: 20px auto;
      text-align: center;
    }

    .gallery img {
      width: 30%;
      margin: 10px;
      float: left;
      border: 3px solid #fff;
    }

    .clear { clear: both; }

    /* RSVP button */
    #rsvp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #e74c3c;
      color: white;
      padding: 12px 20px;
      border: none;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      z-index: 2;
    }

    /* RSVP Modal */
    #popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 20px;
      border: 2px solid #333;
      z-index: 10;
      display: none;
      width: 300px;
      box-shadow: 0 0 10px black;
    }

    #popup input, #popup select {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }

    #popup button {
      background: #2980b9;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
    }

    #close {
      background: #ccc;
      color: black;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="welcome-box">
      <h1>Welcome to TechFest 2025</h1>
      <p>Join us for a day of innovation, fun, and futuristic tech at our annual college fest!</p>
      <p><strong>Date:</strong> August 20, 2025</p>
      <p><strong>Venue:</strong> Main Auditorium, CSE Block</p>
    </div>
    <table>
      <tr>
        <th>Time</th>
        <th>Event</th>
        <th>Speaker</th>
      </tr>
      <tr>
        <td>10:00 AM</td>
        <td>Opening Ceremony</td>
        <td>XYZ </td>
      </tr>
      <tr>
        <td>11:00 AM</td>
        <td>AI Showcase</td>
        <td>Ms. EFG</td>
      </tr>
      <tr>
        <td>1:00 PM</td>
        <td>Hackathon Launch</td>
        <td>Tech Committee</td>
      </tr>
    </table>
    <div class="gallery">
      <img src="https://tse4.mm.bing.net/th/id/OIP.N-28KWRNk7Lb5XSsYN2eRgHaFs?pid=ImgDet&w=190&h=146&c=7&cb=idpwebpc2" alt="Gallery 1">
      <img src="https://th.bing.com/th?q=Ai+Transparent+Background&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&pid=InlineBlock&rm=3&mkt=en-IN&cc=IN&setlang=en&adlt=strict&t=1&mw=247" alt="Gallery 2">
      <img src="https://media.istockphoto.com/id/1355214711/vector/hackathon-concept-with-icon-set-with-big-word-or-text-on-center.jpg?s=612x612&w=0&k=20&c=OCPR3JwGM9sSIb9dB9WQ_z9K5LEwzH49htnhQpjCu74=" alt="Gallery 3">
    </div>
    <div class="clear"></div>
  </div>

  <button id="rsvp-btn" onclick="document.getElementById('popup').style.display='block'">RSVP Now</button>

  <div id="popup">
    <h3>RSVP Form</h3>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <input type="tel" placeholder="Phone Number" required>
    <select>
      <option>Student</option>
      <option>Faculty</option>
      <option>Guest</option>
    </select>
    <button>Submit</button>
    <button id="close" onclick="document.getElementById('popup').style.display='none'">Close</button>
  </div>

</body>
</html>
