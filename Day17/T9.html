<button class="shrink-button">Click Me</button>

<style>
.shrink-button {
  padding: 12px 24px;
  font-size: 16px;
  background-color: #3498db;
  color: white;
  border: none;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.shrink-button:active {
  transform: scale(0.95); /* slight shrink on click */
}
</style>
