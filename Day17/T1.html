<button class="hover-btn">Click Me</button>

<style>
.hover-btn {
  background-color: #3498db;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.hover-btn:hover {
  background-color: #2ecc71; /* changes on hover */
}
</style>
