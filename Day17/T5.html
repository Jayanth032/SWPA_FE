<a class="underline-link" href="#">Hover Underline</a>

<style>
.underline-link {
  position: relative;
  text-decoration: none;
  color: #333;
}

.underline-link::after {
  content: '';
  position: absolute;
  width: 0%;
  height: 2px;
  background-color: #333;
  left: 0;
  bottom: -2px;
  transition: width 0.3s ease;
}

.underline-link:hover::after {
  width: 100%;
}
</style>
