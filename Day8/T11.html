
<!DOCTYPE html>
<html>
<head>
  <title>Simple Table</title>
</head>
<body>

<h2 style="text-align: center;">Student Info</h2>

<table border="1" style="border-collapse: collapse; margin: auto;">
  <thead>
    <tr>
      <th style="padding: 10px; text-align: center;">Name</th>
      <th style="padding: 10px; text-align: center;">Class</th>
      <th style="padding: 10px; text-align: center;">Marks</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td style="padding: 10px; text-align: center;">Alice</td>
      <td style="padding: 10px; text-align: center;">10</td>
      <td style="padding: 10px; text-align: center;">92</td>
    </tr>
    <tr>
      <td style="padding: 10px; text-align: center;">Bob</td>
      <td style="padding: 10px; text-align: center;">10</td>
      <td style="padding: 10px; text-align: center;">88</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="3" style="padding: 10px; text-align: center;">End of Table</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
