<!DOCTYPE html>
<html>
  <head>
    <title>HTML Cheat Sheet</title>
  </head>
  <body>

    <h1>HTML Cheat Sheet</h1>

    <dl>
      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/h1" target="_blank"><strong>&lt;h1&gt;</strong></a></dt>
      <dd>Defines the main heading of a webpage.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/p" target="_blank"><mark>&lt;p&gt;</mark></a></dt>
      <dd>Represents a paragraph of text.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/a" target="_blank"><strong>&lt;a&gt;</strong></a></dt>
      <dd>Creates a hyperlink to another page or resource.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img" target="_blank"><mark>&lt;img&gt;</mark></a></dt>
      <dd>Embeds an image into the webpage.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ul" target="_blank"><strong>&lt;ul&gt;</strong></a></dt>
      <dd>Defines an unordered list.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/ol" target="_blank"><strong>&lt;ol&gt;</strong></a></dt>
      <dd>Defines an ordered (numbered) list.</dd>

      <dt><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/li" target="_blank"><mark>&lt;li&gt;</mark></a></dt>
      <dd>Represents an item in a list.</dd>


    </dl>

  </body>
</html>
