<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Flexbox Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Task 1: Flex Container -->
  <section class="task1">
    <h2>Flex Container (3 items)</h2>
    <div class="flex-container row">
      <div class="box">Item 1</div>
      <div class="box">Item 2</div>
      <div class="box">Item 3</div>
    </div>
  </section>

  <!-- Task 3: Column Direction -->
  <section class="task2">
    <h2>Flex Direction: Column</h2>
    <div class="flex-container column">
      <div class="box">Item A</div>
      <div class="box">Item B</div>
      <div class="box">Item C</div>
    </div>
  </section>

  <!-- Task 4: Gap -->
  <section class="task3">
    <h2>Flex with Gap</h2>
    <div class="flex-container row gap">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </section>

  <!-- Task 5: Flex Navbar -->
  <section class="navbar">
    <div class="nav-container">
      <div class="logo">MyLogo</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </section>

</body>
</html>
