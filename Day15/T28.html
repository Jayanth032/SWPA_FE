<!DOCTYPE html>
<html>
<head>
  <title>Task 28 – Navbar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #1976D2;
      color: white;
    }

    .nav-menu {
      display: flex;
      gap: 20px;
    }

    .nav-menu a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .nav-menu {
        flex-direction: column;
        align-items: flex-end;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">MyLogo</div>
    <div class="nav-menu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

</body>
</html>
