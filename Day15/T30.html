<!DOCTYPE html>
<html>
<head>
  <title>Task 30 – Pricing Section</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pricing-section {
      display: flex;
      justify-content: space-evenly;
      align-items: flex-start;
      background-color: #F1F8E9;
      padding: 40px 20px;
    }

    .plan h2 {
      color: #388E3C;
    }

    .plan p {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="pricing-section">
    <div class="plan">
      <h2>Basic</h2>
      <p>₹199/month</p>
      <p>✔ 5 Projects<br>✔ Email Support</p>
    </div>
    <div class="plan">
      <h2>Pro</h2>
      <p>₹499/month</p>
      <p>✔ 25 Projects<br>✔ Priority Support</p>
    </div>
    <div class="plan">
      <h2>Enterprise</h2>
      <p>₹999/month</p>
      <p>✔ Unlimited Projects<br>✔ 24x7 Phone Support</p>
    </div>
  </div>

</body>
</html>
