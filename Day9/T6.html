<!DOCTYPE html>
<html>
<head>
  <title>Form Styling</title>
  <style>
    input {
      border: 2px solid black;
      margin: 5px;
      padding: 5px;
    }

    button {
      background-color: darkblue;
      color: white;
      padding: 10px 15px;
      border: none;
    }
  </style>
</head>
<body>
  <form>
    <input type="text" placeholder="Enter name">
    <input type="email" placeholder="Enter email">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
