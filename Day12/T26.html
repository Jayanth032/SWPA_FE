<style>
  .z-box {
    position: absolute;
    width: 150px;
    height: 150px;
    color: white;
    text-align: center;
    line-height: 150px;
  }

  .box1 {
    background: red;
    top: 50px;
    left: 50px;
    z-index: 1;
  }

  .box2 {
    background: blue;
    top: 100px;
    left: 100px;
    z-index: 2; /* Appears on top */
  }
</style>

<div class="z-box box1">Box 1</div>
<div class="z-box box2">Box 2</div>
