<style>
  .image-wrapper {
    position: relative;
    display: inline-block;
  }

  .main-image {
    width: 300px;
    height: auto;
  }

  .overlay-image {
    position: absolute;
    bottom: 10px;

    width: 100px;
    opacity: 0.8;
  }
</style>
