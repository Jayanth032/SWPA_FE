<style>
  .image-container {
    position: relative;
    display: inline-block;
  }

  .background-image {
    width: 300px;
  }

  .overlay-button {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 2;
    padding: 10px 15px;
    background: orange;
    color: white;
    border: none;
    cursor: pointer;
  }

  .overlay-text {
    position: absolute;
    top: 10px;
    left: 20px;
    z-index: 1;
    color: white;
    font-weight: bold;
  }
</style>

<div class="image-container">
  <img src="https://via.placeholder.com/300x200" class="background-image">
  <div class="overlay-text">Sample Text</div>
  <button class="overlay-button">Click </button>
</div>
