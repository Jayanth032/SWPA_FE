<style>
  .relative-parent {
    position: relative;
    width: 300px;
    height: 150px;
    background: lightgray;
    margin-bottom: 20px;
  }

  .absolute-child {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: steelblue;
    color: white;
    padding: 5px 10px;
  }
</style>

<div class="relative-parent">
  Parent (Relative)
  <div class="absolute-child">Child (Absolute)</div>
</div>
